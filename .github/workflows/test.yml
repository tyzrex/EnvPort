name: validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - run: make check test-race smoke smoke-lan
      - run: python3 scripts/check_secrets.py
      - run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
      - run: staticcheck ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...
  s3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - run: go install github.com/minio/minio@RELEASE.2025-09-07T16-13-09Z
      - run: make test-minio
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - run: make release-local
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-experimental-cli
          path: dist/0.1.0-dev/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-and-checksums
          path: |
            dist/0.1.0-dev/*.zip
            dist/0.1.0-dev/SHA256SUMS
