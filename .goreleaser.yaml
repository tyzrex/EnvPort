version: 2
project_name: envport
builds:
  - main: ./cmd/envport
    binary: envport
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/envport-dev/envport/internal/transport/cli.Version={{.Version}}
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md, SECURITY.md, THIRD_PARTY_NOTICES.md, "docs/**"]
checksum:
  name_template: SHA256SUMS
changelog:
  disable: true
release:
  draft: true
